[pytest]
testpaths = tests
python_files = test_*.py

# --------------------------------------------------------------------------- #
# La asimetría del motor de reglas
# --------------------------------------------------------------------------- #
# Los errores de clasificación NO son todos iguales, así que los tests tampoco.
#
#   pytest -m subtriaje     <- ESTE es el que tiene que bloquear el build.
#   pytest                  <- todo, con los sobretriajes como warning.
#
markers =
    subtriaje: caso crítico (se espera naranja o rojo). Si el motor devuelve algo menos urgente, el build FALLA: un falso negativo acá es alguien que se queda en casa cuando debería estar en una guardia.
    sobretriaje: caso tolerable (se espera verde o azul). Si el motor devuelve amarillo se registra como warning: manda a alguien a una consulta que no necesitaba, molesto pero no peligroso.
    intermedio: caso donde se espera amarillo, casi siempre por fallback o por el piso del motivo.
